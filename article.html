<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Article — Godefroid Dika Liba</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0B2545;
  --paper:#FFFFFF;
  --accent:#8E2A3B;
  --text:#17202B;
  --muted:#5A6472;
  --line:#E4E0D8;
  --serif:'Source Serif 4',Georgia,serif;
  --sans:'Public Sans',system-ui,sans-serif;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--text);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.7;
}

a{color:inherit}

.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 24px;
}

header.site{
  border-bottom:1px solid var(--line);
  position:relative;
}

.masthead{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  text-decoration:none;
  font-family:var(--serif);
  font-weight:600;
  font-size:18px;
  color:var(--ink);
}

nav.main{
  display:flex;
  gap:26px;
}

nav.main a{
  text-decoration:none;
  font-weight:600;
  font-size:14.5px;
  color:var(--ink);
  padding:4px 0;
  border-bottom:1px solid transparent;
}

nav.main a:hover{
  color:var(--accent);
  border-color:var(--accent);
}

details.mobile-nav{display:none;}

@media (max-width:1100px){
  nav.main{display:none;}
  details.mobile-nav{display:block;}
  details.mobile-nav summary{
    list-style:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--sans);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
    padding:6px 0;
    border:0;
    background:none;
  }
  details.mobile-nav summary::-webkit-details-marker{display:none;}
  details.mobile-nav summary::after{
    content:"";
    width:6px;
    height:6px;
    border-right:1.5px solid var(--accent);
    border-bottom:1.5px solid var(--accent);
    transform:rotate(45deg);
    position:relative;
    top:-1px;
    transition:transform .15s ease;
  }
  details.mobile-nav[open] summary::after{transform:rotate(-135deg); top:2px;}
  details.mobile-nav .panel{
    position:absolute;
    left:0;
    right:0;
    top:100%;
    background:#FFFFFF;
    border-bottom:1px solid var(--line);
    box-shadow:0 12px 22px rgba(11,37,69,.07);
    padding:10px 24px 16px;
    z-index:60;
  }
  details.mobile-nav .panel a{
    display:block;
    padding:13px 0;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  details.mobile-nav .panel a:last-child{border-bottom:0;}
}

.article{
  max-width:720px;
  margin:0 auto;
  padding:88px 24px 84px;
}

.eyebrow{
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 14px;
}

.date{
  font-size:14px;
  color:var(--muted);
  margin-bottom:16px;
}

h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(34px,6vw,50px);
  line-height:1.14;
  letter-spacing:-.015em;
  color:var(--ink);
  margin:0 0 22px;
}

.byline{
  color:var(--muted);
  font-size:15px;
  margin-bottom:36px;
}

.cover{
  width:100%;
  display:block;
}

.content{
  font-size:18px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.content p{
  margin:0 0 24px;
}

.content h2{
  font-family:var(--serif);
  color:var(--ink);
  font-size:32px;
  font-weight:600;
  line-height:1.3;
  letter-spacing:-.01em;
  margin:52px 0 18px;
}

.content h3{
  font-family:var(--serif);
  color:var(--ink);
  font-size:23px;
  font-weight:600;
  line-height:1.35;
  margin:40px 0 14px;
}

.content strong{
  color:var(--ink);
}

.content blockquote{
  margin:32px 0;
  padding:4px 0 4px 22px;
  border-left:3px solid var(--accent);
  font-family:var(--serif);
  font-style:italic;
  font-size:1.06em;
  color:var(--ink);
}

.content blockquote p{
  margin:0 0 14px;
}

.content ul,
.content ol{
  margin:0 0 26px;
  padding-left:26px;
}

.content li{
  margin-bottom:8px;
}

.keywords{
  margin-top:48px;
  padding-top:22px;
  border-top:1px solid var(--line);
}

.keywords p.label{
  margin:0 0 12px;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--accent);
}

.keywords ul{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.keywords li{
  margin:0;
  padding:5px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:13.5px;
  color:var(--muted);
}

.content a{
  color:var(--accent);
}

.back{
  display:inline-block;
  margin-bottom:34px;
  color:var(--muted);
  text-decoration:none;
  font-size:14.5px;
}

.back:hover{
  color:var(--accent);
}

.related{
  margin-top:56px;
  padding-top:28px;
  border-top:1px solid var(--line);
}

.related p.label{
  margin:0 0 14px;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--accent);
}

.related a{
  display:block;
  padding:14px 0;
  text-decoration:none;
  font-family:var(--serif);
  font-size:19px;
  color:var(--ink);
  border-top:1px solid var(--line);
}

.related a:hover{
  color:var(--accent);
}

.source-link{
  margin:0 0 40px;
}

.cover-wrap{
  margin:0 0 42px;
}

.cover{
  margin:0;
}

.caption{
  margin:10px 2px 0;
  font-size:13px;
  color:var(--muted);
  font-style:italic;
}

.source-link a{
  color:var(--accent);
  font-weight:600;
  font-size:14.5px;
  text-decoration:none;
  border-bottom:1px solid currentColor;
  padding-bottom:1px;
}

.source-link a:hover{
  color:var(--ink);
}

footer{
  border-top:1px solid var(--line);
  padding:44px 0;
  margin-top:20px;
  color:var(--muted);
  font-size:14px;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}

@media (max-width:1100px) and (min-width:768px){
  .wrap{padding:0 40px;}
  .article{max-width:680px; padding:64px 24px 72px;}
  h1{font-size:clamp(36px,5vw,44px);}
  .content h2{font-size:29px;}
}

@media(max-width:767px){
  .wrap{padding:0 20px;}

  .article{
    padding-top:36px;
    padding-left:26px;
    padding-right:26px;
  }

  h1{font-size:clamp(30px,8vw,36px);}

  .content{
    font-size:17px;
    line-height:1.85;
  }

  .content p{
    margin:0 0 27px;
  }

  .content h2{font-size:25px; margin-top:40px;}
  .content h3{font-size:21px;}
}
</style>
</head>

<body>

<header class="site">
  <div class="wrap masthead">
    <a class="brand" href="/">Godefroid Dika Liba</a>

    <nav class="main" aria-label="Navigation principale">
      <a href="reflexions.html">Réflexions</a>
      <a href="reflexions.html?cat=nationalite">Nationalité</a>
      <a href="reflexions.html?cat=citoyennete">Citoyenneté</a>
      <a href="reflexions.html?cat=diaspora">Diaspora</a>
      <a href="reflexions.html?cat=regards">Regards d'Afrique</a>
      <a href="a-propos.html">À propos</a>
    </nav>

    <details class="mobile-nav">
      <summary>Menu</summary>
      <div class="panel">
        <a href="reflexions.html">Réflexions</a>
        <a href="reflexions.html?cat=nationalite">Nationalité</a>
        <a href="reflexions.html?cat=citoyennete">Citoyenneté</a>
        <a href="reflexions.html?cat=diaspora">Diaspora</a>
        <a href="reflexions.html?cat=regards">Regards d'Afrique</a>
        <a href="a-propos.html">À propos</a>
      </div>
    </details>
  </div>
</header>

<main class="article">
  <a class="back" href="reflexions.html">← Toutes les réflexions</a>

  <div id="article">
    Chargement…
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>Godefroid Dika Liba</span>
    <a href="mailto:contactgodefroid@gmail.com">contactgodefroid@gmail.com</a>
    <span>© 2026 · <a href="mentions-legales.html">Mentions légales</a></span>
  </div>
</footer>

<script src="marked.min.js"></script>
<script>
(function(){

  var slug = new URLSearchParams(location.search).get('slug');
  var root = document.getElementById('article');


  /* Temps de lecture estimé : ~220 mots par minute, hors notes et références */
  function readMin(a){
    var t = String((a && a.body) || '');
    var plain = !a || a.format === 'plain';
    var paras = t.split(/\n\s*\n/).filter(function(p){
      p = p.trim();
      if(/^\\?\[\d+\\?\]\s/.test(p)){ return false; }          /* notes du type [1] … */
      if(plain && /^\d+\.\s/.test(p)){ return false; }         /* références numérotées (anciens articles) */
      return true;
    });
    t = paras.join('\n\n');
    if(!plain){ t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`>#]+/g, ' '); }
    t = t.replace(/https?:\/\/\S+/g, ' ');
    var words = (t.match(/[\p{L}\p{N}][\p{L}\p{N}'’\-]*/gu) || []).length;
    return words < 40 ? 0 : Math.max(1, Math.round(words / 220));
  }
  function readLabel(a){ var m = readMin(a); return m ? m + ' min de lecture' : ''; }

  fetch('data/articles.json')
    .then(function(r){ return r.json(); })
    .then(function(data){

      var article = (data.articles || []).find(function(a){
        return a.slug === slug;
      });

      if(!article){
        root.innerHTML = '<p>Article introuvable.</p>';
        return;
      }

      document.title = article.title + ' — Godefroid Dika Liba';

      var html = '';

      var parts = [];
      if(article.category){ parts.push(article.category); }
      if(article.type){ parts.push(article.type); }
      if(article.source){ parts.push(article.source); }
      var eyebrowText = parts.length ? parts.join(' · ') : 'Réflexion';

      html += '<div class="eyebrow">' + eyebrowText + '</div>';
      var rl = readLabel(article);
      html += '<div class="date">' + (article.date || '') + (rl ? ' · ' + rl : '') + '</div>';
      html += '<h1>' + article.title + '</h1>';

      if(article.author){
        html += '<div class="byline">Par ' + article.author + '</div>';
      }

      if(article.sourceUrl){
        html += '<p class="source-link"><a href="' + article.sourceUrl + '" target="_blank" rel="noopener">Publication originale ↗</a></p>';
      }

      if(article.image){
        var caption = article.imageCaption || article.caption || '';
        html += '<figure class="cover-wrap">';
        html += '<img class="cover" src="' + article.image + '" alt="' + (caption ? caption.replace(/"/g,'&quot;') : '') + '">';
        if(caption){
          html += '<figcaption class="caption">' + caption + '</figcaption>';
        }
        html += '</figure>';
      }

      html += '<div class="content">';

      if(article.format !== 'plain' && window.marked){
        html += marked.parse(article.body || '', {breaks:true, gfm:true});
      } else {
        var paragraphs = (article.body || '').split(/\n\s*\n/);
        paragraphs.forEach(function(p){
          p = p.trim();
          if(!p) return;
          var h = p.match(/^(#{1,3})\s+([^\n]+)$/);
          if(h){
            var tag = h[1].length >= 3 ? 'h3' : 'h2';
            html += '<' + tag + '>' + h[2] + '</' + tag + '>';
          } else {
            html += '<p>' + p.replace(/\n/g,'<br>') + '</p>';
          }
        });
      }

      html += '</div>';

      var kws = String(article.keywords || '').split(',').map(function(k){ return k.trim(); }).filter(Boolean);
      if(kws.length){
        html += '<div class="keywords"><p class="label">Mots-clés</p><ul>';
        kws.forEach(function(k){
          html += '<li>' + k.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</li>';
        });
        html += '</ul></div>';
      }

      if(article.category){
        var others = (data.articles || []).filter(function(a){
          return a.category === article.category && a.slug !== article.slug;
        });
        if(others.length){
          html += '<div class="related">';
          html += '<p class="label">Dans la même thématique</p>';
          others.forEach(function(a){
            html += '<a href="article.html?slug=' + encodeURIComponent(a.slug) + '">' + a.title + '</a>';
          });
          html += '</div>';
        }
      }

      html += '<a class="back" style="margin-top:36px;" href="reflexions.html">← Toutes les réflexions</a>';

      root.innerHTML = html;
    })
    .catch(function(){
      root.innerHTML = '<p>Impossible de charger l’article.</p>';
    });

})();
</script>

</body>
</html>

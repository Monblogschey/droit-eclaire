<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Article — Godefroid Dika Liba</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0B2545;
  --paper:#FFFFFF;
  --accent:#8E2A3B;
  --text:#17202B;
  --muted:#5A6472;
  --line:#E4E0D8;
  --serif:'Source Serif 4',Georgia,serif;
  --sans:'Public Sans',system-ui,sans-serif;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--text);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.7;
}

a{color:inherit}

.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 24px;
}

header.site{
  border-bottom:1px solid var(--line);
  position:relative;
}

.masthead{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  text-decoration:none;
  font-family:var(--serif);
  font-weight:600;
  font-size:18px;
  color:var(--ink);
}

nav.main{
  display:flex;
  gap:26px;
}

nav.main a{
  text-decoration:none;
  font-weight:600;
  font-size:14.5px;
  color:var(--ink);
  padding:4px 0;
  border-bottom:1px solid transparent;
}

nav.main a:hover{
  color:var(--accent);
  border-color:var(--accent);
}

details.mobile-nav{display:none;}

@media (max-width:900px){
  nav.main{display:none;}
  details.mobile-nav{display:block;}
  details.mobile-nav summary{
    list-style:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--sans);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
    padding:6px 0;
    border:0;
    background:none;
  }
  details.mobile-nav summary::-webkit-details-marker{display:none;}
  details.mobile-nav summary::after{
    content:"";
    width:6px;
    height:6px;
    border-right:1.5px solid var(--accent);
    border-bottom:1.5px solid var(--accent);
    transform:rotate(45deg);
    position:relative;
    top:-1px;
    transition:transform .15s ease;
  }
  details.mobile-nav[open] summary::after{transform:rotate(-135deg); top:2px;}
  details.mobile-nav .panel{
    position:absolute;
    left:0;
    right:0;
    top:100%;
    background:#FFFFFF;
    border-bottom:1px solid var(--line);
    box-shadow:0 12px 22px rgba(11,37,69,.07);
    padding:10px 24px 16px;
    z-index:60;
  }
  details.mobile-nav .panel a{
    display:block;
    padding:13px 0;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  details.mobile-nav .panel a:last-child{border-bottom:0;}
}

.article{
  max-width:760px;
  margin:0 auto;
  padding:70px 24px 80px;
}

.eyebrow{
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 14px;
}

.date{
  font-size:14px;
  color:var(--muted);
  margin-bottom:16px;
}

h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(34px,5vw,52px);
  line-height:1.12;
  letter-spacing:-.015em;
  color:var(--ink);
  margin:0 0 20px;
}

.byline{
  color:var(--muted);
  font-size:15px;
  margin-bottom:36px;
}

.cover{
  width:100%;
  display:block;
}

.content{
  font-size:18px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.content p{
  margin:0 0 24px;
}

.content h2{
  font-family:var(--serif);
  color:var(--ink);
  font-size:30px;
  line-height:1.3;
  margin:44px 0 18px;
}

.content h3{
  font-family:var(--serif);
  color:var(--ink);
  font-size:24px;
  margin:36px 0 14px;
}

.content a{
  color:var(--accent);
}

.back{
  display:inline-block;
  margin-bottom:34px;
  color:var(--muted);
  text-decoration:none;
  font-size:14.5px;
}

.back:hover{
  color:var(--accent);
}

.related{
  margin-top:56px;
  padding-top:28px;
  border-top:1px solid var(--line);
}

.related p.label{
  margin:0 0 14px;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--accent);
}

.related a{
  display:block;
  padding:14px 0;
  text-decoration:none;
  font-family:var(--serif);
  font-size:19px;
  color:var(--ink);
  border-top:1px solid var(--line);
}

.related a:hover{
  color:var(--accent);
}

.source-link{
  margin:0 0 40px;
}

.cover-wrap{
  margin:0 0 42px;
}

.cover{
  margin:0;
}

.caption{
  margin:10px 2px 0;
  font-size:13px;
  color:var(--muted);
  font-style:italic;
}

.source-link a{
  color:var(--accent);
  font-weight:600;
  font-size:14.5px;
  text-decoration:none;
  border-bottom:1px solid currentColor;
  padding-bottom:1px;
}

.source-link a:hover{
  color:var(--ink);
}

footer{
  border-top:1px solid var(--line);
  padding:44px 0;
  margin-top:20px;
  color:var(--muted);
  font-size:14px;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}

@media(max-width:700px){
  .article{
    padding-top:36px;
    padding-left:26px;
    padding-right:26px;
  }

  .content{
    font-size:17px;
    line-height:1.85;
  }

  .content p{
    margin:0 0 27px;
  }
}
</style>
</head>

<body>

<header class="site">
  <div class="wrap masthead">
    <a class="brand" href="/">Godefroid Dika Liba</a>

    <nav class="main" aria-label="Navigation principale">
      <a href="reflexions.html">Réflexions</a>
      <a href="reflexions.html?cat=nationalite">Nationalité</a>
      <a href="reflexions.html?cat=citoyennete">Citoyenneté</a>
      <a href="reflexions.html?cat=diaspora">Diaspora</a>
      <a href="reflexions.html?cat=regards">Regards d'Afrique</a>
      <a href="a-propos.html">À propos</a>
    </nav>

    <details class="mobile-nav">
      <summary>Menu</summary>
      <div class="panel">
        <a href="reflexions.html">Réflexions</a>
        <a href="reflexions.html?cat=nationalite">Nationalité</a>
        <a href="reflexions.html?cat=citoyennete">Citoyenneté</a>
        <a href="reflexions.html?cat=diaspora">Diaspora</a>
        <a href="reflexions.html?cat=regards">Regards d'Afrique</a>
        <a href="a-propos.html">À propos</a>
      </div>
    </details>
  </div>
</header>

<main class="article">
  <a class="back" href="reflexions.html">← Toutes les réflexions</a>

  <div id="article">
    Chargement…
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>Godefroid Dika Liba</span>
    <a href="mailto:godefroidschey@gmail.com">godefroidschey@gmail.com</a>
    <span>© 2026 · <a href="mentions-legales.html">Mentions légales</a></span>
  </div>
</footer>

<script>
(function(){

  var slug = new URLSearchParams(location.search).get('slug');
  var root = document.getElementById('article');

  fetch('data/articles.json')
    .then(function(r){ return r.json(); })
    .then(function(data){

      var article = (data.articles || []).find(function(a){
        return a.slug === slug;
      });

      if(!article){
        root.innerHTML = '<p>Article introuvable.</p>';
        return;
      }

      document.title = article.title + ' — Godefroid Dika Liba';

      var html = '';

      var parts = [];
      if(article.category){ parts.push(article.category); }
      if(article.type){ parts.push(article.type); }
      if(article.source){ parts.push(article.source); }
      var eyebrowText = parts.length ? parts.join(' · ') : 'Réflexion';

      html += '<div class="eyebrow">' + eyebrowText + '</div>';
      html += '<div class="date">' + (article.date || '') + '</div>';
      html += '<h1>' + article.title + '</h1>';

      if(article.author){
        html += '<div class="byline">Par ' + article.author + '</div>';
      }

      if(article.sourceUrl){
        html += '<p class="source-link"><a href="' + article.sourceUrl + '" target="_blank" rel="noopener">Publication originale ↗</a></p>';
      }

      if(article.image){
        var caption = article.imageCaption || article.caption || '';
        html += '<figure class="cover-wrap">';
        html += '<img class="cover" src="' + article.image + '" alt="' + (caption ? caption.replace(/"/g,'&quot;') : '') + '">';
        if(caption){
          html += '<figcaption class="caption">' + caption + '</figcaption>';
        }
        html += '</figure>';
      }

      html += '<div class="content">';

      var paragraphs = (article.body || '')
        .split(/\n\s*\n/);

      paragraphs.forEach(function(p){
        p = p.trim();
        if(p) html += '<p>' + p.replace(/\n/g,'<br>') + '</p>';
      });

      html += '</div>';

      if(article.category){
        var others = (data.articles || []).filter(function(a){
          return a.category === article.category && a.slug !== article.slug;
        });
        if(others.length){
          html += '<div class="related">';
          html += '<p class="label">Dans la même thématique</p>';
          others.forEach(function(a){
            html += '<a href="article.html?slug=' + encodeURIComponent(a.slug) + '">' + a.title + '</a>';
          });
          html += '</div>';
        }
      }

      html += '<a class="back" style="margin-top:36px;" href="reflexions.html">← Toutes les réflexions</a>';

      root.innerHTML = html;
    })
    .catch(function(){
      root.innerHTML = '<p>Impossible de charger l’article.</p>';
    });

})();
</script>

</body>
</html>
